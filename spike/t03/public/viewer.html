<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T03 viewer</title>
<style>
  body { margin: 0; background: #555; font: 13px sans-serif; color: #fff; }
  .page { position: relative; margin: 12px auto; width: max-content; }
  canvas { display: block; background: #fff; }
  .box { position: absolute; outline: 1px solid rgba(255, 0, 0, 0.8); }
  .line { position: absolute; background: rgba(0, 120, 255, 0.15); }
  .tag { position: absolute; font-size: 10px; color: #c00; background: #fff8; }
  #status { padding: 8px; }
</style>
</head>
<body>
<div id="status">loading…</div>
<script type="module">
  // Renders the /run PDF with pdf.js and draws the data-gt boxes read after Paged.js.
  import * as pdfjs from '/pdfjs/pdf.min.mjs';
  pdfjs.GlobalWorkerOptions.workerSrc = '/pdfjs/pdf.worker.min.mjs';
  const params = new URLSearchParams(location.search);
  const scale = Number(params.get('scale') ?? 1.5);
  const run = await (await fetch(`/run?${params}`)).json();
  const snap = run.snapshots[params.get('snap') ?? 'pagedAfter'];
  const bytes = Uint8Array.from(atob(run.pdfBase64), (c) => c.charCodeAt(0));
  const doc = await pdfjs.getDocument({ data: bytes }).promise;
  const k = scale; // boxes are in pt, the canvas is pt * scale
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const vp = page.getViewport({ scale });
    const wrap = document.createElement('div');
    wrap.className = 'page';
    wrap.id = `page-${p}`;
    const canvas = document.createElement('canvas');
    canvas.width = vp.width;
    canvas.height = vp.height;
    wrap.append(canvas);
    document.body.append(wrap);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    for (const b of snap.blocks.filter((b) => b.page === p)) {
      const [x0, y0, x1, y1] = b.box.map((v) => v * k);
      const el = document.createElement('div');
      el.className = 'box';
      Object.assign(el.style, { left: `${x0}px`, top: `${y0}px`, width: `${Math.min(x1, vp.width) - x0}px`, height: `${y1 - y0}px` });
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = `${b.id} ${b.type}`;
      Object.assign(tag.style, { left: `${x0}px`, top: `${y0 - 11}px` });
      wrap.append(el, tag);
      for (const l of b.lines) {
        const [a, c, d, e] = l.map((v) => v * k);
        if (a > vp.width) continue;
        const ln = document.createElement('div');
        ln.className = 'line';
        Object.assign(ln.style, { left: `${a}px`, top: `${c}px`, width: `${d - a}px`, height: `${e - c}px` });
        wrap.append(ln);
      }
    }
  }
  document.getElementById('status').textContent = `pages ${doc.numPages}, blocks ${snap.blocks.length}, overflow ${JSON.stringify(run.overflow)}`;
  window.__viewerDone = true;
</script>
</body>
</html>
