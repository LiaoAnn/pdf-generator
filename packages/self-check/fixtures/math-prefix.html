<!doctype html>
<!-- Both copies fit in the 360pt by 36pt formula box at (54,54).
     Transparent MathML is painted first; clipped MathML would be omitted. -->
<html lang="en">
<meta charset="utf-8">
<title>Painted MathML prefix</title>
<style>
@page { size: A4; margin: 54pt; }
html, body { margin: 0; padding: 0; }
body { font: 12pt/18pt sans-serif; }
.formula { width: 360pt; height: 36pt; }
.katex-mathml { color: transparent; }
</style>
<div class="formula"><span class="katex-mathml"><math><semantics><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow><annotation encoding="application/x-tex">x+y</annotation></semantics></math></span><span class="katex-html">x + y</span></div>
</html>
