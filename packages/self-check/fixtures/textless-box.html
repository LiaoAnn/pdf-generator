<!doctype html>
<!-- Ground truth is measured ONLY from the unshifted Paged.js DOM in the test.
40px = 30pt; the 20mm page margin reproduces the T08-1 page-frame attack.
The checkbox has no label or glyph. Everything is local, including the PNG.
The PNG is one opaque dark pixel (#111), stretched to fill the image box. -->
<html lang="en">
<head><meta charset="utf-8"><title>Text-free geometry</title>
<style>
@page { size: A4; margin: 20mm; }
html, body { margin: 0; padding: 0; }
* { box-sizing: border-box; }
[data-gt] { display: block; margin: 0 0 20pt; }
#image { width: 40px; height: 40px; }
#checkbox { width: 20pt; height: 20pt; border: 1pt solid black; }
#bordered, #underline, #blank { width: 120pt; height: 24pt; }
#bordered { border: 1pt solid black; }
#underline { border-bottom: 1pt solid black; }
#barcode { position: relative; width: 100pt; height: 30pt; }
/* CSS bars avoid an SVG's full-box clip hiding an internal bar displacement. */
#barcode::before { content: ''; position: absolute; top: 0; bottom: 0;
  left: 7pt; right: 7pt;
  background: repeating-linear-gradient(90deg, black 0 2pt, transparent 2pt 4pt); }
#centred-dot, #corner-dots { position: relative; width: 100px; height: 100px; }
#centred-dot i, #corner-dots i { position: absolute; width: 1px; height: 1px; background: black; }
#centred-dot i { left: 49.5px; top: 49.5px; }
#corner-dots i:first-child { left: 0; top: 0; }
/* Different paints keep the two rectangles as separate PDF marks. */
#corner-dots i:last-child { right: 0; bottom: 0; background: #111; }
/* VARIANT */
</style></head><body>
<img id="image" data-gt="image" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGMQFBT8DwABnQEzlaSNGgAAAABJRU5ErkJggg==">
<span id="checkbox" data-gt="checkbox"></span>
<div id="bordered" data-gt="field"></div>
<div id="underline" data-gt="field"></div>
<div id="barcode" data-gt="image"></div>
<div id="blank" data-gt="field"></div>
<div id="centred-dot" data-gt="image"><i></i></div>
<div id="corner-dots" data-gt="image"><i></i><i></i></div>
</body></html>
