<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Soft mask applied to a composited group</title>
    <style>
      @page { size: 320px 400px; margin: 0; }
      body { margin: 0; }
      svg { display: block; position: absolute; left: 40px; top: 40px; width: 100px; height: 100px; }
    </style>
  </head>
  <body>
    <svg id="masked-group" data-gt="image" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="crispEdges">
      <title>Masked group</title>
      <defs>
        <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
          <rect width="100" height="100" fill="white" fill-opacity="MASK_ALPHA" />
        </mask>
      </defs>
      <g mask="url(#m)">
        <rect width="100" height="100" fill="black" />
        <!-- OVERPAINT -->
      </g>
    </svg>
  </body>
</html>
