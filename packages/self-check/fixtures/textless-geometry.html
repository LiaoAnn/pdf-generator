<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Textless ink geometry</title>
<style>
@page { size: A4; margin: 20mm; }
html, body { margin: 0; padding: 0; }
body { width: 340px; font-size: 0; }
section { display: inline-block; vertical-align: top; box-sizing: border-box;
  width: 140px; height: 140px; padding: 20px; margin: 0 24px 24px 0;
  break-inside: avoid; }
svg { display: block; width: 100px; height: 100px; }
.band { background: #234567; }
</style></head><body>
<section><svg aria-hidden="true" id="corner-path" data-gt="image" viewBox="0 0 100 100"><path d="M0 0h1v1h-1z M99 99h1v1h-1z"/></svg></section>
<section><svg aria-hidden="true" id="cancelled-path" data-gt="image" viewBox="0 0 100 100"><path fill-rule="evenodd" d="M0 0h100v100h-100z M0 0h100v100h-100z"/></svg></section>
<section><svg aria-hidden="true" id="white-path" data-gt="image" viewBox="0 0 100 100"><rect width="100" height="100" fill="white"/></svg></section>
<section><svg aria-hidden="true" id="erased-path" data-gt="image" viewBox="0 0 100 100"><rect width="100" height="100"/><rect width="100" height="100" fill="white"/></svg></section>
<section><svg aria-hidden="true" id="empty-clip" data-gt="image" viewBox="0 0 100 100"><defs><clipPath id="empty"><path clip-rule="evenodd" d="M0 0h100v100h-100z M0 0h100v100h-100z"/></clipPath></defs><rect width="100" height="100" clip-path="url(#empty)"/></svg></section>
<!-- Real ink covers 60% on x, but is off-centre on both axes. The cancelled
     full-box path must not supply anchoring (nor may the SVG viewport clip). -->
<section><svg aria-hidden="true" id="unanchored-path" data-gt="image" viewBox="0 0 100 100"><path fill-rule="evenodd" d="M0 0h100v100h-100z M0 0h100v100h-100z"/><rect x="10" y="20" width="60" height="10"/></svg></section>
<section class="band"><svg aria-hidden="true" id="band-logo" data-gt="image" viewBox="0 0 100 100"><path fill="white" d="M10 10h80v80h-80z M30 30v40h40v-40z" fill-rule="evenodd"/></svg></section>
<section class="band"><svg aria-hidden="true" id="band-hidden" data-gt="image" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" fill="#234567"/></svg></section>
</body></html>
