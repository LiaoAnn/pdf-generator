<!doctype html>
<!--
Hand derivation (pt): A4 is 595.28 x 841.89 with 54pt margins.
Six border-box blocks, each 300pt x 36pt without margins, stack at
x=54, y=54+36*n (n=0..5); x1=354 and y1=y+36.
The hand-written KaTeX shapes include inline and display wrappers. MathML
is clipped using KaTeX's hiding rules, not display:none: its annotation
must supply LaTeX without contaminating the visible glyph text.
The first two formulas obtain LaTeX from x-tex annotations. The third uses
only the attribute and preserves its internal double space. The fourth
has matching sources after trimming. The fifth has two visible parts and
one explicit source, so its text is joined with one space. The sixth has
two matching annotations and an explicit source, removing the ambiguity.
The first two formulas and both visible parts of the fifth contain KaTeX's
vlist-s U+200B filler. It is absent from the printed text, so adding it must
leave the existing hand-derived JSON byte-identical.
Expected JSON is hand-written from this design, never from the reader.
-->

[data-gt] { display: block; width: 300pt; height: 36pt; margin: 0; padding: 0; }

.katex-mathml { position: absolute; clip: rect(1px,1px,1px,1px); padding: 0; border: 0; height: 1px; width: 1px; overflow: hidden; }
</style>
</head>
