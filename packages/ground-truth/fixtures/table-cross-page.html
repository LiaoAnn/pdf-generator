<!doctype html>
<!--
Hand derivation (pt): page 600 x 408, margins 48, content height 312.
Page 1's 300pt fixed table has columns 120 + 180pt, edges x=48,168,348.
Paged.js drops the colgroup on continuation: page 2 has no column or cell
width declarations, so fixed layout divides 300pt equally into 150 + 150pt,
with x edges 48,198,348 (also for a cloned header without width attributes).
Each row is 24pt. Page 1 fits exactly 13 rows: Name/Val and r0..r11;
the table box is [48,48,348,360]. Cell y edges are
48,72,96,120,144,168,192,216,240,264,288,312,336,360.
Page 2 starts at y=48 with r12..r15, indexed 0..3 on this page,
with edges 48,72,96,120,144 and table box [48,48,348,144].
No handler repeats the header: page 2 has only body cells, header=false.
Table innerText joins cells with TAB, rows with LF. The continuation
keeps the original table id as its base and links back through continues.
Expected JSON is hand-written from these CSS dimensions, never reader output.

-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cross-page table</title>
<style>
@page { size: 600pt 408pt; margin: 48pt; }
html, body { margin: 0; padding: 0; }
* { box-sizing: border-box; }
body { font: 10pt/12pt sans-serif; }
table { table-layout: fixed; border-collapse: separate; border-spacing: 0; width: 300pt; }
td, th { padding: 0; border: 0; height: 24pt; }
col.a { width: 120pt; }
col.b { width: 180pt; }
</style>

</head>
<body>
<table data-gt="table" data-gt-id="t">
<colgroup><col class="a"><col class="b"></colgroup>
<thead><tr><th>Name</th><th>Val</th></tr></thead>
<tbody>
<tr><td>r0</td><td>0</td></tr>
<tr><td>r1</td><td>1</td></tr>
<tr><td>r2</td><td>2</td></tr>
<tr><td>r3</td><td>3</td></tr>
<tr><td>r4</td><td>4</td></tr>
<tr><td>r5</td><td>5</td></tr>
<tr><td>r6</td><td>6</td></tr>
<tr><td>r7</td><td>7</td></tr>
<tr><td>r8</td><td>8</td></tr>
<tr><td>r9</td><td>9</td></tr>
<tr><td>r10</td><td>10</td></tr>
<tr><td>r11</td><td>11</td></tr>
<tr><td>r12</td><td>12</td></tr>
<tr><td>r13</td><td>13</td></tr>
<tr><td>r14</td><td>14</td></tr>
<tr><td>r15</td><td>15</td></tr>
</tbody>
</table>
</body>
</html>
